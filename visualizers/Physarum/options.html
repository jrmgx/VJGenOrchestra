<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <div>Physarum by <a href="https://github.com/amandaghassaei">Amanda Ghassaei</a></div>
  <label>Preset
    <select name="preset" id="preset">
      <option value="Fibers">Fibers</option>
      <option value="Net">Net</option>
      <option value="Honeycomb">Honeycomb</option>
      <option value="Fingerprint">Fingerprint</option>
    </select>
  </label>
  <label>Sensor angle <input type="range" name="sensorAngle" min="0" max="180" step="0.5" value="5.5"></label>
  <label>Sensor distance <input type="range" name="sensorDistance" min="1" max="30" step="0.5" value="18"></label>
  <label>Rotation angle <input type="range" name="rotationAngle" min="-90" max="90" step="1" value="45"></label>
  <script>
    (function() {
      var preset = document.getElementById('preset');
      var presets = {
        Fibers: { sensorAngle: 5.5, sensorDistance: 18, rotationAngle: 45 },
        Fingerprint: { sensorAngle: 70, sensorDistance: 14, rotationAngle: -25 },
        Honeycomb: { sensorAngle: 90, sensorDistance: 7.5, rotationAngle: -45 },
        Net: { sensorAngle: 90, sensorDistance: 18, rotationAngle: -16 }
      };
      function applyPreset() {
        var p = presets[preset.value];
        if (!p) return;
        document.querySelector('[name="sensorAngle"]').value = p.sensorAngle;
        document.querySelector('[name="sensorDistance"]').value = p.sensorDistance;
        document.querySelector('[name="rotationAngle"]').value = p.rotationAngle;
        document.querySelectorAll('input, select').forEach(function(el) {
          el.dispatchEvent(new Event('change', { bubbles: true }));
        });
      }
      preset.addEventListener('change', applyPreset);
    })();
  </script>
</body>
</html>
