<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html,
    body {
      min-height: 0 !important;
      overflow: hidden !important;
    }
    body label {
      padding: 0.12rem 0 !important;
    }
  </style>
</head>
<body>
  <label>
    Miror
    <input type="checkbox" name="miror" checked />
  </label>
  <label>
    Speed
    <input type="range" name="speed" min="-10" max="10" value="1" step="0.05" />
  </label>
  <label>
    Reactive
    <input type="range" name="reactive" min="0" max="50" value="0" step="1" />
  </label>
</body>
</html>
