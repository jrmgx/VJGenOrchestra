<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<style>
  .text-option { display: flex; align-items: flex-start; gap: 0.5rem; }
  .text-option span { flex-shrink: 0; }
  .text-option textarea {
    flex: 1;
    min-width: 0;
    background: #1a1a1a;
    color: #fff;
    border: 1px solid #333;
    padding: 0.4rem;
    font: inherit;
  }
  .font-option label { display: block; margin-bottom: 0.35rem; }
  .font-selector {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    max-height: 12rem;
    overflow-y: auto;
    padding: 0.25rem 0;
  }
  .font-selector button {
    text-align: left;
    padding: 0.35rem 0.5rem;
    border: 1px solid #444;
    background: #222;
    color: #fff;
    cursor: pointer;
    border-radius: 4px;
    font-size: 0.95rem;
  }
  .font-selector button:hover { border-color: #666; }
  .font-selector button.selected { border-color: #0af; background: #1a2830; }
</style>
</head>
<body>
  <label class="text-option"><span>Text</span><textarea name="text" rows="3" placeholder="Type text…"></textarea></label>
  <label>Color <input type="color" name="color" value="#ffffff"></label>
  <div class="font-option">
    <label>Font</label>
    <input type="hidden" name="font" id="fontInput" value="">
    <div class="font-selector" id="fontSelector"></div>
  </div>
  <script>
(function() {
  const container = document.getElementById("fontSelector");
  const input = document.getElementById("fontInput");
  const jsonUrl = new URL("../../assets/fonts/fonts.json", document.baseURI).href;

  function loadFonts() {
    try {
      const req = new XMLHttpRequest();
      req.open("GET", jsonUrl + "?t=" + Date.now(), false);
      req.send();
      if (req.status !== 200 && req.status !== 0) return [];
      return JSON.parse(req.responseText);
    } catch {
      return [];
    }
  }

  function injectFaces(entries) {
    const css = entries
      .filter((e) => e && !e.system && e.src && e.family)
      .map((e) => {
        const u = new URL("../../" + e.src, document.baseURI).href;
        return "@font-face{font-family:" + e.family + ";src:url(" + JSON.stringify(u) + ");}";
      })
      .join("");
    if (!css) return;
    const style = document.createElement("style");
    style.id = "text-font-faces";
    style.textContent = css;
    document.head.appendChild(style);
  }

  function syncSelection() {
    const v = input.value;
    container.querySelectorAll("button").forEach((btn) => {
      btn.classList.toggle("selected", btn.dataset.value === v);
    });
  }

  const entries = loadFonts();
  injectFaces(entries);
  if (entries.length) {
    const defaultFamily =
      entries.find((e) => e.family === "sans-serif")?.family ?? entries[0].family;
    entries.forEach((e) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.dataset.value = e.family;
      btn.textContent = e.label;
      btn.style.fontFamily = e.family + ", sans-serif";
      btn.addEventListener("click", () => {
        input.value = btn.dataset.value;
        input.dispatchEvent(new Event("change", { bubbles: true }));
        syncSelection();
        window.parent.postMessage({ type: "optionsSync" }, "*");
      });
      container.appendChild(btn);
    });
    if (!input.value) input.value = defaultFamily;
  }
  document.addEventListener("optionsApplied", syncSelection);
  syncSelection();
})();
  </script>
</body>
</html>
