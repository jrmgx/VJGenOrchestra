<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <label>Twist <input type="range" name="twist" min="0" max="4" step="0.05" value="2"> 0–4</label>
  <label>Speed <input type="range" name="speed" min="-1" max="1" step="0.02" value="0.35"> − / + (spiral drift)</label>
  <label>Depth pulse <input type="range" name="pulse" min="0" max="1" step="0.02" value="0"> in / out</label>
  <label>Pulse rate <input type="range" name="pulseSpeed" min="0" max="2" step="0.05" value="0.5"></label>
  <label><input type="checkbox" name="reactive"> Reactive</label>
</body>
</html>
