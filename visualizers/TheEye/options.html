<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <label><input type="checkbox" name="reactive" checked> Reactive</label>
  <label><input type="checkbox" name="effectTunnel"> Tunnel effect</label>
  <label><input type="checkbox" name="effectRays" checked> Rays effect</label>
  <label>Rays speed <input type="range" name="raySpeed" min="-5" max="5" step="0.1" value="0.3"><output name="raySpeedVal">0.3</output></label>
  <label>Rays color <input type="color" name="rayColor" value="#d3d3d3"></label>
  <label>Tunnel speed <input type="range" name="tunnelSpeed" min="-5" max="5" step="0.1" value="0.25"><output name="tunnelSpeedVal">0.25</output></label>
  <label>Effect thickness <input type="range" name="effectThickness" min="1" max="5" step="0.1" value="1"><output name="effectThicknessVal">1</output></label>
  <label>Tunnel color <input type="color" name="tunnelColor" value="#d3d3d3"></label>
  <label>Iris color <input type="color" name="irisColor" value="#196bd7"></label>
  <script>
    function syncOutputs() {
      document.querySelectorAll('input[type="range"]').forEach(function(inp) {
        var out = inp.parentElement.querySelector('output');
        if (out) out.textContent = inp.value;
      });
    }
    document.querySelectorAll('input[type="range"]').forEach(function(inp) {
      inp.addEventListener('input', syncOutputs);
    });
    document.addEventListener('optionsApplied', syncOutputs);
    syncOutputs();
  </script>
</body>
</html>
